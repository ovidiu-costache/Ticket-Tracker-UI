<div>
    <p>Cheia Ticket-ului: {{ ticket.ticketKey }}</p>

    <!--Am legat atributul HTML [title] de description-->
    <h2 [title]="ticket.description">Titlu: {{ ticket.title }}</h2>

    <p>Descriere: {{ ticket.description }}</p>

    <!--Butonul care declanseaza metoda de output-->
    <button (click)="removeTicket()">Sterge acest tichet</button>
</div>
