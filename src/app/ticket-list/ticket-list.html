<button (click)="clearList()">Sterge tichetele</button>
<button (click)="populateList()">Adauga tichetele</button>

@if (tickets.length == 0) {
    <p>Lista de tichete este vida!</p>
}

<!--Daca nu exista tichete, stie singur sa nu incerce bucla for-->
@for (ticket of tickets; track ticket.id) {
    <app-ticket-card
        [ticket]="ticket">
    </app-ticket-card>
}
